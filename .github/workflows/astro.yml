name: Deploy Astro site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUILD_PATH: "."

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Context Health report
        run: pnpm context:health:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Check contact form public env presence
        run: |
          test -n "$PUBLIC_TURNSTILE_SITE_KEY" || (echo "Missing PUBLIC_TURNSTILE_SITE_KEY GitHub Actions variable" && exit 1)
          test -n "$PUBLIC_CONTACT_API_URL" || (echo "Missing PUBLIC_CONTACT_API_URL GitHub Actions variable" && exit 1)
          echo "Turnstile site key present"
          echo "Contact API URL present: $PUBLIC_CONTACT_API_URL"
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CONTACT_API_URL: ${{ vars.PUBLIC_CONTACT_API_URL }}

      - name: Build with Astro
        run: pnpm build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CONTACT_API_URL: ${{ vars.PUBLIC_CONTACT_API_URL }}

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Copy Storybook to dist
        run: |
          mkdir -p dist/design-system/lab
          cp -r storybook-static/* dist/design-system/lab/

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Generate Site Quality JSON
        run: pnpm quality:generate

      - name: Rebuild Astro with Site Quality data
        run: pnpm build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CONTACT_API_URL: ${{ vars.PUBLIC_CONTACT_API_URL }}

      - name: Copy Storybook to dist (final)
        run: |
          mkdir -p dist/design-system/lab
          cp -r storybook-static/* dist/design-system/lab/

      - name: Verify contact endpoint in built output
        run: |
          echo "Checking contact form endpoint..."
          grep -o 'data-contact-api-url="[^"]*"' dist/contact/index.html || true
          grep -o "$PUBLIC_CONTACT_API_URL" dist/contact/index.html
        env:
          PUBLIC_CONTACT_API_URL: ${{ vars.PUBLIC_CONTACT_API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
